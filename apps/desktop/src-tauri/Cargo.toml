[package]
name = "voice-of-fish-desktop"
version = "0.1.0"
description = "Voice of Fish desktop shell"
authors = ["Voice of Fish"]
edition = "2021"

[lib]
name = "voice_of_fish_desktop"
path = "src/lib.rs"

[[bin]]
name = "voice-of-fish-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
dirs = "6"
sha2 = "0.10"
regex-lite = "0.1"
ureq = "3"

tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
